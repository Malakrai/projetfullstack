<article [ngClass]="{ ancien: estAncien() }">
  @if (estAncien()) {
    <p class="mention">Film ancien · sorti avant 2000</p>
  }
  <h3>
    <a [routerLink]="['/films', film().id]">{{ film().titre }}</a>
  </h3>
  <p>Réalisateur : {{ film().realisateur ?? 'inconnu' }}</p>
  <p>Sortie : {{ film().dateSortie ? (film().dateSortie | date: 'dd/MM/yyyy') : 'date inconnue' }}</p>
  <button type="button" class="danger" [disabled]="desactive()" (click)="onSupprimer()">Supprimer</button>
</article>
