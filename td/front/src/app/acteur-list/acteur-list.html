<section>
  <h2>Liste des acteurs</h2>
  @if (erreur()) {
    <p role="alert">{{ erreur() }}</p>
  } @else if (acteurs(); as liste) {
    <ul>
      @for (acteur of liste; track acteur.id) {
        <li>{{ acteur.prenom }} {{ acteur.nom }}</li>
      } @empty {
        <li>Aucun acteur enregistré.</li>
      }
    </ul>
  } @else {
    <p>Chargement des acteurs...</p>
  }
</section>
