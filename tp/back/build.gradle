/*
 * build.gradle de référence du cours.
 *
 * Aucune version n'est fixée manuellement sur les dépendances Spring : le plugin
 * io.spring.dependency-management importe le BOM Spring Boot, qui aligne les
 * versions entre elles. Seule la version du plugin org.springframework.boot est
 * à faire évoluer.
 */

plugins {
    id 'java'
    id 'org.springframework.boot'        version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // spring-boot-starter-webmvc apporte Spring MVC, Jackson et un Tomcat embarqué,
    // ainsi que spring-context : le conteneur IoC utilisé dans les premiers TP.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
}
